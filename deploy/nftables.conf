#!/usr/sbin/nft -f
# Egress allow-list for the claims server (CLAUDE.md, section 8).
# Outbound traffic from the host and from containers is limited to:
#   - DNS to the configured resolvers,
#   - HTTPS to hosts listed in /etc/claims/allowed_hosts (resolved into egress_v4 / egress_v6
#     every 5 minutes by claims-egress-refresh),
#   - NTP to the configured time servers.
# Inbound: SSH from admin networks only, HTTP/HTTPS for the web UI.
#
# Docker manages its own iptables-nft rules; this table hooks forward at priority -10,
# so its drops apply to container traffic before Docker's accepts.
# This file is an Ansible template (Jinja variables: resolvers_v4, ntp_v4, admin_cidrs_v4).

table inet claims
delete table inet claims

table inet claims {
	set egress_v4 { type ipv4_addr; flags timeout; }
	set egress_v6 { type ipv6_addr; flags timeout; }
	set resolvers_v4 { type ipv4_addr; elements = { {{ resolvers_v4 }} } }
	set ntp_v4 { type ipv4_addr; flags interval; elements = { {{ ntp_v4 }} } }
	set admin_v4 { type ipv4_addr; flags interval; elements = { {{ admin_cidrs_v4 }} } }

	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		meta l4proto { icmp, ipv6-icmp } accept
		tcp dport 22 ip saddr @admin_v4 accept
		tcp dport { 80, 443 } accept
		iifname "docker0" accept
		iifname "br-*" accept
	}

	chain output {
		type filter hook output priority filter; policy drop;
		ct state established,related accept
		oif lo accept
		meta l4proto { icmp, ipv6-icmp } accept
		oifname "docker0" accept
		oifname "br-*" accept
		ip daddr @resolvers_v4 meta l4proto { tcp, udp } th dport 53 accept
		ip daddr @ntp_v4 udp dport 123 accept
		ip daddr @egress_v4 tcp dport 443 accept
		ip6 daddr @egress_v6 tcp dport 443 accept
		log prefix "claims-egress-drop " level warn limit rate 10/minute
	}

	chain from_containers {
		oifname "docker0" return
		oifname "br-*" return
		ip daddr @resolvers_v4 meta l4proto { tcp, udp } th dport 53 accept
		ip daddr @egress_v4 tcp dport 443 accept
		ip6 daddr @egress_v6 tcp dport 443 accept
		log prefix "claims-fwd-drop " level warn limit rate 10/minute
		drop
	}

	chain forward {
		type filter hook forward priority -10; policy accept;
		ct state established,related accept
		iifname "docker0" jump from_containers
		iifname "br-*" jump from_containers
	}
}
