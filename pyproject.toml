[project]
name = "claims-app"
version = "0.1.0"
description = "Developer delay-penalty claims analysis for law firms"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=1.11,<2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "rq>=2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyotp>=2.9",
    "argon2-cffi>=23",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "qrcode>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]
ocr = ["pytesseract>=0.3.13", "pypdfium2>=4"]
ner = ["spacy>=3.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["calculator*", "pipeline*", "app*"]

[tool.pytest.ini_options]
testpaths = ["calculator/tests", "pipeline/tests", "app/tests", "evals/tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["calculator"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
