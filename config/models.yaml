# Model settings per pipeline step (CLAUDE.md, section 4).
# Env overrides: CLAIMS_MODEL_<STEP>, e.g. CLAIMS_MODEL_EXTRACT=claude-sonnet-5-5
#
# effort: low | medium | high | xhigh | max; omit for models without effort support (Haiku 4.5).
# refusal_fallback: server-side fallback on safety refusals (beta, Claude API only;
#   supported on Opus 5.5 / Sonnet 5.5, not on Haiku 4.5). Set false on Bedrock/Vertex/Foundry.

steps:
  classify:
    model: claude-haiku-4-5-20251001
    max_tokens: 2000
    refusal_fallback: false
  extract:
    model: claude-sonnet-5-5
    effort: high
    max_tokens: 32000
    refusal_fallback: true
  clauses:
    model: claude-opus-5-5
    effort: high
    max_tokens: 32000
    refusal_fallback: true
  letter:
    model: claude-sonnet-5-5
    effort: medium
    max_tokens: 8000
    refusal_fallback: true
